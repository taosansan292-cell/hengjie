<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#063b70">
  <title>恒洁 H｜首页</title>
  <style>
    :root{--navy:#063b70;--blue:#0b65ad;--ink:#09192b;--muted:#52667b;--line:#e7edf3}
    *{box-sizing:border-box}html{background:#edf2f6}body{margin:0;color:var(--ink);font-family:"PingFang SC","PingFang TC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}.home{width:min(100%,480px);min-height:100vh;margin:auto;background:#fff}.top{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:1px solid var(--line)}.brand{font-weight:600;letter-spacing:.04em;color:var(--navy);font-size:18px}.brand small{display:block;margin-top:3px;color:#61758a;font-size:10px;letter-spacing:.04em;font-weight:400}.profile{display:grid;place-items:center;width:31px;height:31px;border:1px solid #cbd8e5;border-radius:50%;color:var(--navy);font-size:12px;font-weight:600}.welcome{padding:40px 20px 28px;background:linear-gradient(140deg,#0b63ab,#073665);color:#fff}.welcome h1{margin:0 0 8px;font-size:30px;line-height:1.25;font-weight:600;letter-spacing:-.03em}.welcome span{font-size:14px;color:#eaf5ff}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:20px}.quick div{min-height:95px;padding:15px 12px;border:1px solid var(--line);background:#fff}.quick b{display:block;font-size:15px}.quick span{display:block;margin-top:8px;color:var(--muted);font-size:12px}.feed{padding:0 20px}.feed h2{margin:8px 0 15px;font-size:21px}.feed article{padding:18px 0;border-top:1px solid var(--line)}.feed b{font-size:15px}.feed p{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.6}.mask{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(0,28,59,.68);backdrop-filter:blur(3px)}.popup{position:relative;display:flex;flex-direction:column;width:min(100%,358px);aspect-ratio:452/570;min-height:452px;overflow:hidden;background:#053c70 url("assets/design-week-water.png") center/cover no-repeat;color:#fff;box-shadow:0 24px 64px rgba(0,0,0,.42);isolation:isolate}.popup:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,43,86,.27) 0%,rgba(2,33,69,.28) 35%,rgba(0,29,62,.88) 100%)}.popup:after{content:"H";position:absolute;z-index:-1;right:22px;top:86px;color:rgba(255,255,255,.16);font-size:142px;line-height:1;font-weight:500}.close{position:absolute;z-index:1;right:15px;top:15px;display:grid;place-items:center;width:34px;height:34px;border:1px solid rgba(255,255,255,.55);border-radius:50%;background:rgba(0,45,85,.22);color:#fff;cursor:pointer}.close svg{width:18px;height:18px}.popup-top{padding:42px 27px 0;color:#fff}.popup-top h2{margin:0;font-size:31px;line-height:1.18;letter-spacing:-.04em}.popup-top h2:after{content:"2026 GUANGZHOU DESIGN WEEK";display:block;margin-top:12px;color:#e3f3ff;font-size:11px;letter-spacing:.1em;font-weight:400}.popup-body{margin-top:auto;padding:28px 27px 27px;border-top:1px solid rgba(255,255,255,.48);background:linear-gradient(180deg,rgba(0,31,64,.06),rgba(0,31,64,.36))}.popup-body:before{content:"相约设计周";display:block;margin-bottom:9px;font-size:14px;letter-spacing:.16em}.popup-body p{margin:0;color:#e7f4ff;font-size:14px;line-height:1.7}.signup-link{display:flex;align-items:center;justify-content:space-between;margin-top:21px;padding:15px 17px;border:1px solid #fff;background:#fff;color:#063b70;text-decoration:none;font-size:16px;font-weight:600;letter-spacing:.05em}.signup-link:after{content:"→";font-size:21px;font-weight:400;line-height:1}.signup-link:hover{background:#e6f3ff}.signup-link:focus-visible,.close:focus-visible{outline:3px solid #e7b85b;outline-offset:3px}.is-hidden{display:none}@media(min-width:700px){body{padding:24px}.home{border-radius:14px;overflow:hidden}.mask{padding:40px}.popup{border-radius:9px}}
  .home-carousel{position:relative;display:block;color:#fff;text-decoration:none;padding:32px 24px 26px;min-height:220px;background:#063b70 url("assets/design-week-water.png") center/cover}.home-carousel:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,40,80,.72),rgba(0,40,80,.28))}.home-carousel>*{position:relative}.home-carousel h1{font-size:30px}.home-carousel-entry{display:flex;margin-top:24px;align-items:center;gap:14px;font-size:15px!important}.home-carousel-entry svg{width:22px;height:22px}.home-dot{display:block;width:22px;height:2px;background:#fff;margin:20px auto 0}.mask{margin:0;width:100%;max-width:none;height:100dvh;max-height:none;border:0;overflow:auto}.mask:not([open]){display:none}.popup{flex-shrink:0}.close{width:44px;height:44px;top:10px;right:10px}.home-carousel:focus-visible{outline:3px solid #e7b85b;outline-offset:-4px}@media(max-height:540px){.mask{align-items:flex-start}.popup{min-height:420px}}
  </style>
</head>
<body>
  <main class="home" aria-label="恒洁 H 首页">
    <header class="top"><div class="brand">恒洁 HEGII<small>选品质 · 就是选生活</small></div><span class="profile">我</span></header>
    <a class="welcome home-carousel" href="index.html" aria-label="进入广州设计周专区"><h1>广州设计周</h1><span>2026.12.04 — 12.08</span><span class="home-carousel-entry">报名通道<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></span><span class="home-dot" aria-hidden="true"></span></a>
    <section class="quick" aria-label="快捷入口"><div><b>设计灵感</b><span>精选案例</span></div><div><b>品牌活动</b><span>设计现场</span></div><div><b>我的服务</b><span>专属权益</span></div></section>
    <section class="feed"><h2>近期关注</h2><article><b>设计，让生活更美好</b><p>关注恒洁设计动态，发现空间与生活的更多可能。</p></article><article><b>新品与品质空间</b><p>从产品体验到人居场景，持续探索品质生活灵感。</p></article></section>
  </main>
  <dialog class="mask" id="design-week-entry" role="dialog" aria-modal="true" aria-labelledby="entry-title">
    <div class="popup">
      <button class="close" id="close-entry" aria-label="关闭设计周入口"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
      <div class="popup-top"><h2 id="entry-title">广州设计周专区</h2></div>
      <div class="popup-body"><p>2026.12.04 — 12.08</p><a class="signup-link" href="index.html">报名通道</a></div>
    </div>
  </dialog>
  <script>const entry=document.querySelector('#design-week-entry');entry.showModal();document.querySelector('#close-entry').addEventListener('click',()=>entry.close());entry.addEventListener('close',()=>document.querySelector('.home-carousel').focus());</script>
</body>
</html>
